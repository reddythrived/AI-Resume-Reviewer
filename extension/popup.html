<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 280px;
      padding: 16px;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #f1f5f9;
      border-radius: 8px;
    }
    .logo { font-size: 24px; margin-bottom: 8px; }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; color: #f1f5f9; }
    p { font-size: 12px; color: #94a3b8; margin-bottom: 16px; line-height: 1.4; }
    .btn {
      display: block;
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn:active { opacity: 0.8; }
    .footer { margin-top: 12px; font-size: 10px; color: #64748b; text-align: center; }
  </style>
</head>
<body>
  <div class="logo">📄</div>
  <h1>AI Resume Analyzer</h1>
  <p>Analyze your resume with AI-powered insights, scores, and suggestions.</p>
  <button class="btn" id="openApp">Open Resume Analyzer</button>
  <p class="footer">Powered by NLP & Flask</p>
  <script src="popup.js"></script>
</body>
</html>
